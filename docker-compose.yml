name: cashflow

services:
  postgres-entries:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "${ENTRIES_POSTGRES_PORT}:5432"
    volumes:
      - postgres-entries:/var/lib/postgresql/data
      - ./docker/postgres/entries-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  postgres-balance:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "${BALANCE_POSTGRES_PORT}:5432"
    volumes:
      - postgres-balance:/var/lib/postgresql/data
      - ./docker/postgres/balance-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    entrypoint: ["/bin/bash", "/etc/rabbitmq/render-definitions.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_PASSWORD}
      ENTRIES_RABBITMQ_USER: ${ENTRIES_RABBITMQ_USER}
      ENTRIES_RABBITMQ_PASSWORD: ${ENTRIES_RABBITMQ_PASSWORD}
      BALANCE_RABBITMQ_USER: ${BALANCE_RABBITMQ_USER}
      BALANCE_RABBITMQ_PASSWORD: ${BALANCE_RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.template.json:ro
      - ./docker/rabbitmq/render-definitions.sh:/etc/rabbitmq/render-definitions.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "${ASPIRE_PORT}:18888"

  entries:
    build:
      context: .
      dockerfile: src/Cashflow.Entries/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: ${ENTRIES_DB_DEFAULT}
      ConnectionStrings__Migrations: ${ENTRIES_DB_MIGRATIONS}
      ConnectionStrings__Publisher: ${ENTRIES_DB_PUBLISHER}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__User: ${ENTRIES_RABBITMQ_USER}
      RabbitMq__Password: ${ENTRIES_RABBITMQ_PASSWORD}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__Audience: ${ENTRIES_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT}
    ports:
      - "${ENTRIES_PORT}:8080"
    depends_on:
      postgres-entries:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  balance:
    build:
      context: .
      dockerfile: src/Cashflow.Balance/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: ${BALANCE_DB_DEFAULT}
      ConnectionStrings__Migrations: ${BALANCE_DB_MIGRATIONS}
      ConnectionStrings__Consumer: ${BALANCE_DB_CONSUMER}
      RabbitMq__Host: ${RABBITMQ_HOST}
      RabbitMq__User: ${BALANCE_RABBITMQ_USER}
      RabbitMq__Password: ${BALANCE_RABBITMQ_PASSWORD}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__Audience: ${BALANCE_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT}
    ports:
      - "${BALANCE_PORT}:8080"
    depends_on:
      postgres-balance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./src/Cashflow.Web
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID}
      ENTRIES_URL: ${ENTRIES_PUBLIC_URL}
      BALANCE_URL: ${BALANCE_PUBLIC_URL}
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web/config.json.template:/etc/nginx/templates/config.json.template:ro
    depends_on:
      - entries
      - balance
      - keycloak

volumes:
  postgres-entries:
  postgres-balance:
  rabbitmq: